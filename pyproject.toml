[project]
name = "dungeon-autobattler"
version = "0.1.0"
description = "2d Dungeon-Crawler mit Autoba ler kämpfen"
requires-python = ">=3.12"
dependencies = ["pygame-ce"]

[project.optional-dependencies]
dev = ["pytest", "mypy", "ruff", "interrogate", "pre-commit"]
report = ["latexcodec", "pylatex"]

[tool.ruff]
line-length = 80

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false

[tool.pytest.ini_options]
addopts = "--doctest-modules"
testpaths = ["src/dungeon_autobattler", "tests"]
pythonpath = ["."]